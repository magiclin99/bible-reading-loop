<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f5f0e6">
<title>一年讀經一遍</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Reader ─────────────────────────────────────────────── -->
<header id="bar">
  <button id="btn-browse" class="icon-btn" aria-label="瀏覽全部日程">☰</button>
  <div id="bar-center">
    <div id="bar-day"></div>
    <div id="bar-ref"></div>
  </div>
  <button id="btn-fold" class="fold-toggle" aria-label="收合或展開全部經文" hidden></button>
  <button id="btn-track" class="track-toggle" aria-label="切換新舊約"></button>
</header>
<div id="progress" aria-hidden="true"><div id="progress-fill"></div></div>

<main id="reader">
  <div id="pager">
    <article id="page"></article>
  </div>
</main>

<!-- ── 朗讀 ──────────────────────────────────────────────── -->
<div id="player" hidden>
  <button id="pl-play" class="pl-play" aria-label="播放朗讀">▶</button>
  <input id="pl-seek" type="range" min="0" max="1000" value="0" aria-label="朗讀進度">
  <span id="pl-time" class="pl-time">0:00 / 0:00</span>
  <button id="pl-rate" class="pl-chip" aria-label="朗讀速度">1×</button>
  <button id="pl-auto" class="pl-chip" aria-pressed="false" title="整天讀完自動播下一天">自動下一天</button>
</div>

<footer id="foot">
  <button id="btn-prev" class="nav-btn" aria-label="前一天">‹ 前一天</button>
  <button id="btn-read" class="read-btn" aria-label="標記讀完"></button>
  <button id="btn-next" class="nav-btn" aria-label="下一天">下一天 ›</button>
</footer>

<!-- ── Browse overlay ─────────────────────────────────────── -->
<div id="browse" class="overlay" hidden>
  <div class="overlay-bar">
    <strong>全部日程</strong>
    <div class="overlay-actions">
      <button id="browse-track" class="chip"></button>
      <button id="btn-close" class="icon-btn" aria-label="關閉">✕</button>
    </div>
  </div>
  <div id="browse-progress"></div>
  <p class="overlay-hint">點卡片閱讀該天，或按「設為第一天」把它當作你的第 1 天（讀滿 364 天繞一圈）。</p>
  <div id="sync" class="sync" hidden>
    <span id="sync-txt"></span>
    <button id="btn-sync" class="chip"></button>
  </div>
  <div id="browse-list"></div>
</div>

<!-- ── 剛登入時位置不一致的詢問 ──────────────────────────── -->
<div id="link" class="modal" hidden>
  <div class="modal-box">
    <strong>要從哪裡接續閱讀？</strong>
    <p>這台裝置和帳號裡記的閱讀位置不一樣。已讀記錄兩邊都會保留。</p>
    <button id="link-local" class="chip"></button>
    <button id="link-remote" class="chip"></button>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────── -->
<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
